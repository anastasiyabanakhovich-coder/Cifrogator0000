<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Цифрогатор — возраст</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Trebuchet MS,Arial;color:white;background:radial-gradient(circle at 20% 20%,#158fff44,transparent 28%),linear-gradient(145deg,#051025,#0b285d 60%,#061127)}.wrap{max-width:1080px;margin:auto;padding:25px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-weight:900}.brand img{width:54px;height:54px;border-radius:14px;object-fit:cover}.main{min-height:80vh;display:grid;grid-template-columns:.9fr 1.1fr;gap:55px;align-items:center}.mascot{text-align:center}.mascot img{width:min(390px,90vw);border-radius:30px;box-shadow:0 28px 70px #0006}.bubble{margin:-24px auto 0;position:relative;max-width:420px;background:#09214d;border:1px solid #63ddff66;border-radius:20px;padding:18px;font-size:19px;font-weight:900}.ey{color:#63ddff;letter-spacing:3px;text-transform:uppercase;font-size:12px;font-weight:900}h1{font-size:clamp(40px,6vw,64px);margin:10px 0}.sub{color:#b5c8e8;line-height:1.6}.cards{display:grid;gap:15px;margin-top:25px}.age{display:grid;grid-template-columns:60px 1fr 30px;gap:14px;align-items:center;padding:18px;border:1px solid #ffffff25;border-radius:20px;background:#ffffff12;color:#fff;text-decoration:none;transition:.2s}.age:hover{transform:translateX(6px);border-color:#63ddff88;background:#1597ff22}.icon{width:55px;height:55px;display:grid;place-items:center;border-radius:16px;background:#1597ff22;font-size:28px}.age strong{display:block;font-size:21px}.age span{font-size:13px;color:#b4c5e2}.back{display:inline-block;margin-top:22px;color:#9bb1d2}.sound{position:fixed;right:18px;bottom:18px;border:1px solid #ffffff30;background:#0a285a;color:#fff;border-radius:50%;width:48px;height:48px;font-size:20px}@media(max-width:780px){.main{grid-template-columns:1fr;text-align:center}.age{text-align:left}}</style></head><body><div class="wrap"><a class="brand" href="index.html"><img src="assets/logo.png"><span>Цифрогатор</span></a><main class="main"><section class="mascot"><img src="assets/mascot.png"><div class="bubble" id="bubble"></div></section><section><div class="ey">Шаг 2 · выбери маршрут</div><h1>Сколько тебе лет?</h1><p class="sub">Для каждого возраста — свой уровень сложности.</p><div class="cards"><a class="age" href="game.html?age=6"><div class="icon">🌱</div><div><strong>6–8 лет</strong><span>Первые правила безопасного интернета</span></div><b>→</b></a><a class="age" href="game.html?age=9"><div class="icon">🚀</div><div><strong>9–12 лет</strong><span>Цифровые приключения и реальные ситуации</span></div><b>→</b></a><a class="age" href="game.html?age=13"><div class="icon">⚡</div><div><strong>13–17 лет</strong><span>Академия кибербезопасности</span></div><b>→</b></a></div><a class="back" href="index.html">← На главную</a></section></main></div><button class="sound" id="sound" onclick="toggleSound()">🔇</button><script>let n=localStorage.getItem('cifrogator_firstname')||'друг';bubble.textContent=`${n}, выбери свой возраст — я подготовил задания специально для тебя! 😊`;let ctx,t,on=false;function start(){if(on)return;ctx=new (AudioContext||webkitAudioContext)();let m=ctx.createGain();m.gain.value=.025;m.connect(ctx.destination),ns=[146.83,196,220,293.66],i=0;t=setInterval(()=>{let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=ns[i++%ns.length];g.gain.setValueAtTime(.001,ctx.currentTime);g.gain.linearRampToValueAtTime(.5,ctx.currentTime+.1);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+1.3);o.connect(g);g.connect(m);o.start();o.stop(ctx.currentTime+1.4)},1700);on=true;sound.textContent='🔊'}function stop(){clearInterval(t);ctx?.close();on=false;sound.textContent='🔇'}function toggleSound(){on?stop():start()}</script></body></html>
